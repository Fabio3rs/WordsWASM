name: Publish npm packages

on:
  workflow_run:
    workflows: [Native and WebAssembly build]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish validated npm tarballs
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out publisher
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download validated npm packages
        uses: actions/download-artifact@v5
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify or publish packages
        shell: bash
        run: node scripts/bootstrap-publish-npm.mjs "$RUNNER_TEMP/npm-packages/publish-plan.json"
